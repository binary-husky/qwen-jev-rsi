<text x="41" y="753" font-size="16" fill="#344153" text-anchor="start">新调度覆盖旧调度；错过时刻则跳过。</text>
<text x="41" y="783" font-size="16" fill="#344153" text-anchor="start">动作队列满时丢弃最早等待的动作。</text>
<rect x="480" y="687" width="440" height="130" rx="5" fill="#f5f7fa" stroke="none"/>
<text x="497" y="719" font-size="21" fill="#344153" text-anchor="start">按到达顺序决策</text>
<text x="497" y="753" font-size="16" fill="#344153" text-anchor="start">结果允许乱序返回，无需等待早期请求。</text>
<text x="497" y="783" font-size="16" fill="#344153" text-anchor="start">决策与动作各由一个线程串行处理。</text>
<rect x="936" y="687" width="440" height="130" rx="5" fill="#f5f7fa" stroke="none"/>
<text x="953" y="719" font-size="21" fill="#344153" text-anchor="start">分别测量延迟</text>
<text x="953" y="753" font-size="16" fill="#344153" text-anchor="start">推理周期、决策间隔、观测至动作完成。</text>
<text x="953" y="783" font-size="16" fill="#344153" text-anchor="start">主推理线程超出延迟预算时停止运行。</text>
